name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore app
        run: dotnet restore LeaderGame.csproj

      - name: Build console app
        run: dotnet build LeaderGame.csproj --configuration Release --no-restore

      - name: Restore desktop app
        run: dotnet restore LeaderGame.Desktop/LeaderGame.Desktop.csproj

      - name: Build desktop app
        run: dotnet build LeaderGame.Desktop/LeaderGame.Desktop.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test LeaderGame.Tests/LeaderGame.Tests.csproj --configuration Release
